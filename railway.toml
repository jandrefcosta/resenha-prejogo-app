[build]
builder = "nixpacks"
buildCommand = "npm run build"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_20"]

[deploy]
startCommand = "npm run migrate && npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# ─── Cron Jobs ────────────────────────────────────────────────────────────────
# Configure these in the Railway dashboard as separate Cron services.
# Each cron service sends an HTTP POST to the app with the Authorization header.
#
# Required env var: CRON_SECRET  (same value set on the main service)
#
# Job 1 — Match docs (CBF round summaries)
#   Schedule : 0 13 * * *   (daily at 13:00 UTC)
#   URL      : https://<your-domain>/api/admin/run-docs-cron
#   Method   : POST
#   Header   : Authorization: Bearer $CRON_SECRET
#
# Job 2 — Bolão score cron (calculate scores for finished Copa 2026 matches)
#   Schedule : 0 3 * * *    (daily at 03:00 UTC)
#   URL      : https://<your-domain>/api/bolao/score
#   Method   : POST
#   Header   : Authorization: Bearer $CRON_SECRET
#
# Job 3 — Snapshot matches (persist finished matches to Postgres)
#   Schedule : 0 */6 * * *  (every 6h — durable backstop only: the cbfApi /
#              conmebolApi write-throughs keep match_snapshots fresh on
#              organic traffic, so this just needs to cover zero-traffic gaps)
#   URL      : https://<your-domain>/api/cron/snapshot-matches
#   Method   : GET
#   Header   : Authorization: Bearer $CRON_SECRET
#   Monitor  : the handler reports a Sentry cron check-in under monitor slug
#              "snapshot-matches" — a missed or errored run raises an alert,
#              so a silently-dead cron is caught instead of going unnoticed.
